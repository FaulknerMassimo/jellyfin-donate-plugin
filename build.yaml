overview: "Ask users to donate to the person hosting the server."
description: >
  Shows a popup after users log in asking whether they would like to donate, with a
  donate page listing the payment methods the administrator configures (PayPal, Venmo,
  Cash App, Interac e-Transfer, and anything else). Includes a "Don't remind me again"
  option stored per user, and a thank-you message.
category: "General"
artifacts:
