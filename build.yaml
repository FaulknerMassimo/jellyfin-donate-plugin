changelog: |
  ## 1.1.3.0
  Draw a heart on the sidebar entry instead of keeping the icon of the link it
  was cloned from, and add separate resets for opt-outs, the donation count and
  the reminder timers.

  ## 1.1.2.0
  Accept payment links typed without https://, hide payment cards that would
  render empty, and rebuild the sidebar entry by cloning a real nav link so it
  matches the 10.11 React client instead of using the old markup.

  ## 1.1.1.0
  Fix the injected script tag resolving to /web/Donate/ClientScript and 404ing,
  so the client script never loaded in the browser.

  ## 1.1.0.0
  Target Jellyfin 10.11 (net9.0). Sidebar and floating Donate entries, a Status
  panel that explains why the popup is not showing, and on-demand script install.

  ## 1.0.0.0
  Initial release.
